<!doctype html>
<html lang="ps" dir="rtl">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
  <meta name="theme-color" content="#071f35"/>
  <title>Ishaqzada Distribution System</title>
  <link rel="manifest" href="manifest.webmanifest"/>
  <link rel="stylesheet" href="styles.css"/>
</head>
<body>
<div class="app-shell">
  <header class="topbar">
    <button class="icon-btn" id="menuBtn">☰</button>
    <div class="brand-mini"><img src="assets/logo.jpg" alt="Ishaqzada logo"><span>Ishaqzada Distribution System</span></div>
    <button class="icon-btn">🔔</button>
  </header>

  <main id="app"></main>

  <nav class="bottom-nav" id="bottomNav">
    <button data-view="dashboard" class="active">⌂<span>کور</span></button>
    <button data-view="orders">▤<span>آرډرونه</span></button>
    <button data-view="shipments">▣<span>لېږدونه</span></button>
    <button data-view="accounts">$<span>حساب</span></button>
  </nav>
</div>

<template id="loginTpl">
  <section class="auth-page">
    <div class="auth-card">
      <img class="auth-logo" src="assets/logo.jpg" alt="logo">
      <h1>Ishaqzada Distribution System</h1>
      <p>اسحاقزاده د توزیع او ډیلیوري سیستم</p>
      <form id="loginForm" class="form-stack">
        <label>ایمیل<input type="email" required placeholder="name@example.com"></label>
        <label>پاسورډ<input type="password" required placeholder="••••••••"></label>
        <button class="gold-btn" type="submit">ننوتل</button>
      </form>
      <button class="text-btn" id="registerBtn">نوی حساب جوړول</button>
      <div class="demo-note">د ډیمو لپاره هر ایمیل او پاسورډ وکاروئ.</div>
    </div>
  </section>
</template>

<template id="registerTpl">
  <section class="page">
    <div class="page-head"><h2>نوی حساب ثبتول</h2><button class="back-btn" id="backLogin">←</button></div>
    <form id="registerForm" class="card form-grid">
      <label>نوم<input required></label>
      <label>د پلار نوم<input required></label>
      <label>ایمیل<input type="email" required></label>
      <label>پاسورډ<input type="password" required></label>
      <label>موبایل شمېره<input required></label>
      <label>ولایت<select required><option>کندهار</option><option>کابل</option><option>هلمند</option><option>هرات</option><option>ننګرهار</option></select></label>
      <label>ولسوالي / ناحیه<input required placeholder="لکه: ګرشک، سپین بولدک، پنځمه ناحیه"></label>
      <label>د اوسېدو سیمه / بشپړ ادرس<input required></label>
      <label>د تذکرې عکس<input type="file" accept="image/*"></label>
      <label>سلفي عکس<input type="file" accept="image/*" capture="user"></label>
      <button class="gold-btn full" type="submit">د تایید لپاره ثبتول</button>
    </form>
  </section>
</template>

<script src="app.js"></script>
</body>
</html>
