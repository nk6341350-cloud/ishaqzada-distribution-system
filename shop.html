<!doctype html>
<html lang="ps" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#072640">
<title>Ishaqzada Shop</title>
<style>
*{box-sizing:border-box}html,body{margin:0;padding:0;background:#f7f2e8;color:#0b2741;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}:root{--n:#072640;--n2:#0b3454;--g:#d7a637;--cream:#f7f2e8;--line:#e1c98f;--white:#fff;--muted:#64727e}body{min-height:100vh}header{background:linear-gradient(135deg,var(--n),var(--n2));border-bottom:4px solid var(--g);color:#fff;padding-top:env(safe-area-inset-top)}.brand{max-width:1050px;margin:auto;padding:15px 14px;text-align:center}.brand img{width:88px;height:88px;object-fit:cover;border-radius:50%;border:2px solid var(--g);background:#fff}.brand h1{margin:8px 0 3px;font-size:24px}.brand p{margin:0;color:#f3ca67}.wrap{max-width:1050px;margin:auto;padding:14px}.hero{background:linear-gradient(145deg,#fff,#f8efd9);border:1px solid var(--line);border-radius:22px;padding:14px;text-align:center;box-shadow:0 8px 25px rgba(7,38,64,.06)}.hero img{max-width:100%;width:420px;border-radius:18px}.hero h2{margin:10px 0 4px}.hero p{margin:0;color:#7d6227}.products{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}.product{background:#fff;border:1px solid var(--line);border-radius:18px;padding:10px;box-shadow:0 8px 22px rgba(7,38,64,.06);display:flex;flex-direction:column}.product img{width:100%;aspect-ratio:1/1;object-fit:cover;border-radius:14px;background:#f4efe6}.product h3{margin:10px 0 4px;font-size:17px}.price{font-weight:900;color:#9b6b08;font-size:20px}.desc{font-size:13px;color:var(--muted);line-height:1.5;min-height:39px}button{border:0;border-radius:12px;padding:11px 12px;font-weight:900;font-size:14px;cursor:pointer}.gold{background:var(--g);color:var(--n)}.navy{background:var(--n);color:#fff}.full{width:100%}.actions{display:grid;grid-template-columns:1fr;gap:7px;margin-top:auto;padding-top:10px}.empty{background:#fff;border:1px solid var(--line);border-radius:18px;padding:26px;text-align:center;color:var(--muted);margin-top:14px}.modal{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:50;display:none;align-items:center;justify-content:center;padding:14px}.modal.on{display:flex}.box{background:#fff;border-radius:20px;padding:16px;width:min(560px,100%);max-height:92vh;overflow:auto}.head{display:flex;justify-content:space-between;align-items:center;gap:10px}.head h3{margin:0}label{display:block;font-weight:800;margin:10px 0 5px}input,select,textarea{width:100%;padding:12px;border:1px solid #d8c49a;border-radius:12px;background:#fff;color:#0b2741;font-size:16px}textarea{min-height:76px}.summary{background:#f9f3e6;border:1px dashed #d7a637;border-radius:12px;padding:10px;margin:10px 0}.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:#102b41;color:#fff;padding:12px 16px;border-radius:14px;opacity:0;pointer-events:none;transition:.2s;z-index:90;max-width:90%;text-align:center}.toast.show{opacity:1}.footer{margin-top:20px;background:var(--n);color:#fff;border-radius:18px;padding:16px;text-align:center}@media(min-width:760px){.products{grid-template-columns:repeat(4,1fr)}}
</style>
</head>
<body>
<header><div class="brand"><img src="shop-logo.jpg" decoding="async" fetchpriority="high" alt="Ishaqzada"><h1>اسحاقزاده آنلاین دوکان</h1><p>Ishaqzada Fashion Company</p></div></header>
<main class="wrap">
  <section class="hero"><img src="shop-logo.jpg" decoding="async" alt="Ishaqzada Fashion Company"><h2>زموږ اجناس</h2><p>خپل جنس انتخاب کړئ او آرډر مستقیم د هغه جنس مسئول شاګرد ته ولېږئ.</p></section>
  <div id="products" class="products"></div>
  <div class="footer">د اسحاقزاده فیشن شرکت آنلاین دوکان</div>
</main>
<div class="modal" id="orderModal"><div class="box"><div class="head"><h3>آرډر ثبتول</h3><button class="navy" type="button" onclick="closeOrder()">✕</button></div><div id="orderSummary" class="summary"></div><form onsubmit="submitOrder(event)"><label>نوم<input id="cName" required></label><label>موبایل<input id="cPhone" inputmode="tel" required></label><label>ولایت<select id="cProvince" required></select></label><label>ولسوالي / ناحیه<input id="cDistrict" required></label><label>بشپړ ادرس<textarea id="cAddress" required></textarea></label><label>تعداد<input id="cQty" type="number" min="1" value="1" required></label><button class="gold full" style="margin-top:12px">آرډر ثبت او WhatsApp ته واستوه</button></form></div></div>
<div id="toast" class="toast"></div>
<script defer src="https://www.gstatic.com/firebasejs/12.1.0/firebase-app-compat.js"></script>
<script defer src="https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore-compat.js"></script>
<script>
window.addEventListener("DOMContentLoaded",()=>{
const firebaseConfig={apiKey:"AIzaSyBvD5nAxa53PCW-Oe55Yo5VSfrHFsPFNws",authDomain:"ishaqzada-distribution-system.firebaseapp.com",projectId:"ishaqzada-distribution-system",storageBucket:"ishaqzada-distribution-system.firebasestorage.app",messagingSenderId:"1002618741797",appId:"1:1002618741797:web:19d2ad89042eb26c148bcc",measurementId:"G-8SCGTBFGDX"};
firebase.initializeApp(firebaseConfig);const cloudDB=firebase.firestore(),ref=cloudDB.collection("distribution").doc("main");
const P=["بدخشان","بادغیس","بغلان","بلخ","بامیان","دایکندي","فراه","فاریاب","غزني","غور","هلمند","هرات","جوزجان","کابل","کندهار","کاپیسا","خوست","کنړ","کندز","لغمان","لوګر","ننګرهار","نیمروز","نورستان","پکتیا","پکتیکا","پنجشیر","پروان","سمنګان","سرپل","تخار","اروزګان","میدان وردګ","زابل"];
let products=[],selected=null;const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));
function toast(t){const e=document.getElementById("toast");e.textContent=t;e.classList.add("show");setTimeout(()=>e.classList.remove("show"),2200)}
function fillP(){const s=document.getElementById("cProvince");P.forEach(p=>s.add(new Option(p,p)))}
function render(){const box=document.getElementById("products"),a=products.filter(p=>p.active!==false);box.innerHTML=a.length?a.map(p=>`<article class="product"><img src="${p.image}" alt=""><h3>${esc(p.name)}</h3><div class="price">${(+p.price).toLocaleString()} AFN</div><div class="desc">${esc(p.description||"")}</div><div class="actions"><button class="gold" onclick="openOrder('${p.id}')">آرډر وکړه</button><button class="navy" onclick="quickWhatsapp('${p.id}')">WhatsApp اړیکه</button></div></article>`).join(""):'<div class="empty" style="grid-column:1/-1">تر اوسه جنس نه دی پورته شوی.</div>'}
function cleanWhatsApp(n){let x=String(n||"").replace(/\D/g,"");if(x.startsWith("0"))x="93"+x.slice(1);if(!x.startsWith("93"))x="93"+x;return x}
function quickWhatsapp(id){const p=products.find(x=>x.id===id);if(!p)return;const m=`سلام، زه د «${p.name}» په اړه معلومات غواړم.`;location.href=`https://wa.me/${cleanWhatsApp(p.whatsapp)}?text=${encodeURIComponent(m)}`}
function openOrder(id){selected=products.find(x=>x.id===id);if(!selected)return;document.getElementById("orderSummary").innerHTML=`<b>${esc(selected.name)}</b><br><span class="price">${(+selected.price).toLocaleString()} AFN</span><div class="desc">مسئول: ${esc(selected.agentName||"")}</div>`;document.getElementById("orderModal").classList.add("on")}
function closeOrder(){document.getElementById("orderModal").classList.remove("on");selected=null}
async function submitOrder(e){e.preventDefault();if(!selected)return;const qty=Math.max(1,+document.getElementById("cQty").value||1),order={id:"SHOP-"+Date.now(),productId:selected.id,productName:selected.name,unitPrice:+selected.price,qty,total:(+selected.price)*qty,agentId:selected.agentId||"",agentName:selected.agentName||"",whatsapp:selected.whatsapp||"",customerName:document.getElementById("cName").value.trim(),customerPhone:document.getElementById("cPhone").value.trim(),province:document.getElementById("cProvince").value,district:document.getElementById("cDistrict").value.trim(),address:document.getElementById("cAddress").value.trim(),createdAt:new Date().toISOString(),status:"new"};try{await ref.update({shopOrders:firebase.firestore.FieldValue.arrayUnion(order)})}catch(err){console.error(err);toast("آرډر Database ته ثبت نه شو");return}const msg=`نوی آرډر
آرډر: ${order.id}
جنس: ${order.productName}
تعداد: ${order.qty}
ټول قیمت: ${order.total.toLocaleString()} AFN
مشتری: ${order.customerName}
موبایل: ${order.customerPhone}
ولایت: ${order.province}
ولسوالي/ناحیه: ${order.district}
ادرس: ${order.address}`;const wa=`https://wa.me/${cleanWhatsApp(order.whatsapp)}?text=${encodeURIComponent(msg)}`;toast("آرډر ثبت شو؛ WhatsApp خلاصیږي");setTimeout(()=>location.href=wa,350)}
fillP();ref.onSnapshot(d=>{const x=d.data()||{};products=Array.isArray(x.products)?x.products:[];render()},err=>{console.error(err);document.getElementById("products").innerHTML='<div class="empty" style="grid-column:1/-1">د دوکان معلومات نه خلاصیږي.</div>'});
});
</script>
</body></html>
